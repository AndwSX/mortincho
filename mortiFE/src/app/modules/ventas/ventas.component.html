<!-- Header Section -->
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10">
    <div>
        <h1 class="text-3xl font-bold text-white mb-1">Registro de Ventas</h1>
        <p class="text-gray-500 font-light text-sm">Gestión de ventas y sistema de cuotas.</p>
    </div>
    <div class="flex items-center gap-3">
        <button class="bg-white/5 hover:bg-white/10 text-white border border-white/10 px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-sm">
            <i class="bi bi-download"></i>
            Exportar
        </button>
        <button class="btn-primary flex items-center gap-2 text-sm">

</div>

        </div>

        <p class="text-2xl font-bold text-white">$45,280</p>
    </div>
    <div class="glass p-6 rounded-2xl group">
        <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-xl bg-orange-500/10 flex items-center justify-center text-orange-500">
                <i class="bi bi-clock-history text-2xl"></i>
            </div>
            <span class="text-xs font-medium text-gray-500 bg-white/5 px-2 py-1 rounded-lg">$28k total</span>
        </div>
        <h3 class="text-gray-500 text-sm font-medium mb-1">Cuotas Pendientes</h3>
        <p class="text-2xl font-bold text-white">127</p>
    </div>
    <div class="glass p-6 rounded-2xl group">
        <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-xl bg-green-500/10 flex items-center justify-center text-green-500">
                <i class="bi bi-check-circle text-2xl"></i>
            </div>
            <span class="text-xs font-medium text-green-500 bg-green-500/10 px-2 py-1 rounded-lg">+8.2%</span>
        </div>
        <h3 class="text-gray-500 text-sm font-medium mb-1">Entradas Cobradas</h3>
        <p class="text-2xl font-bold text-white">89</p>
    </div>
    <div class="glass p-6 rounded-2xl group">
        <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-xl bg-cyan-500/10 flex items-center justify-center text-cyan-500">
                <i class="bi bi-graph-up text-2xl"></i>
            </div>
        </div>
        <h3 class="text-gray-500 text-sm font-medium mb-1">Tasa Cobranza</h3>
        <p class="text-2xl font-bold text-white">94.2%</p>

                    <th class="px-6 py-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">Producto</th>

                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-500/10 text-green-500">
