<!-- Header Section -->
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10">
    <div>
        <h1 class="text-3xl font-bold text-white mb-1">Gestión de Productos</h1>
        <p class="text-gray-500 font-light text-sm">Administra y controla tu inventario en tiempo real.</p>
    </div>
    <div class="flex items-center gap-3">
        <button class="bg-white/5 hover:bg-white/10 text-white border border-white/10 px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-sm">
            <i class="bi bi-download"></i>
            Exportar
        </button>
        <button class="btn-primary flex items-center gap-2 text-sm">
            <i class="bi bi-plus-lg"></i>
            Nuevo Producto
        </button>
    </div>
</div>

<!-- Filters and Search Bar -->
<div class="glass p-4 rounded-2xl mb-8 flex flex-col lg:flex-row gap-4 items-center">
    <div class="relative flex-1 w-full">
        <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
        <input 
            type="text" 
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchChange()"
            class="input-field w-full pl-12 pr-4 py-2.5 text-sm" 
            placeholder="Buscar por nombre o descripción...">
    </div>
    <div class="flex items-center gap-2 w-full lg:w-auto">
        <div class="relative flex-1 lg:flex-none">
            <select 
                [(ngModel)]="soloActivos"
                (change)="onFilterChange()"
                class="input-field appearance-none pl-4 pr-10 py-2.5 text-sm w-full lg:w-48 bg-[#18181b] cursor-pointer">
                <option [ngValue]="false">Todos los productos</option>
                <option [ngValue]="true">Solo activos</option>
            </select>
            <i class="bi bi-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
        </div>
    </div>
</div>

<!-- Table Section -->
<div class="glass rounded-3xl overflow-hidden shadow-xl shadow-black/20">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-white/[0.02] border-b border-white/5">
                    <th class="px-6 py-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">Nombre</th>
                    <th class="px-6 py-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">Descripción</th>
                    <th class="px-6 py-5 text-xs font-semibold text-gray-400 uppercase tracking-wider text-center">Stock</th>
                    <th class="px-6 py-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">Estado</th>
                    <th class="px-6 py-5 text-xs font-semibold text-gray-400 uppercase tracking-wider text-right">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-white/5">
                <tr *ngFor="let producto of filteredProductos" class="hover:bg-white/[0.01] transition-colors group">
                    <td class="px-6 py-4">
                        <span class="text-sm font-semibold text-white">{{ producto.nombre }}</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-sm text-gray-400 font-light">{{ producto.descripcion }}</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span [ngClass]="producto.stock_actual === 0 ? 'text-red-500 font-bold' : 'text-white'" class="text-sm">
                            {{ producto.stock_actual }}
                        </span>
                        <span class="text-[10px] text-gray-600 ml-1 uppercase">uds</span>
                    </td>
                    <td class="px-6 py-4">
                        <span 
                            [ngClass]="producto.activo ? 'bg-green-500/10 text-green-500' : 'bg-gray-500/10 text-gray-500'"
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider">
                            <span [ngClass]="producto.activo ? 'bg-green-500' : 'bg-gray-500'" class="w-1 h-1 rounded-full mr-1.5"></span>
                            {{ producto.activo ? 'Activo' : 'Inactivo' }}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-1">
                            <button class="p-2 text-gray-500 hover:text-white hover:bg-white/5 rounded-xl transition-all" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button 
                                (click)="toggleEstado(producto)"
                                [ngClass]="producto.activo ? 'text-orange-500 hover:bg-orange-500/10' : 'text-green-500 hover:bg-green-500/10'"
                                class="p-2 rounded-xl transition-all" 
                                [title]="producto.activo ? 'Desactivar' : 'Activar'">
                                <i [ngClass]="producto.activo ? 'bi bi-toggle-on' : 'bi bi-toggle-off'" class="text-xl"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                
                <!-- Empty State -->
                <tr *ngIf="filteredProductos.length === 0 && !isLoading">
                    <td colspan="5" class="px-6 py-20 text-center text-gray-500">
                        <i class="bi bi-box-seam text-4xl mb-4 block opacity-20"></i>
                        No se encontraron productos.
                    </td>
                </tr>

                <!-- Loading State -->
                <tr *ngIf="isLoading">
                    <td colspan="5" class="px-6 py-20 text-center">
                        <span class="spinner !w-8 !h-8 !border-4 !border-blue-600 !border-r-transparent"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
