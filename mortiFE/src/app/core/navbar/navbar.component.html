<div class="h-full px-6 md:px-10 flex items-center justify-between">
    <!-- Breadcrumbs or Search -->
    <div class="hidden sm:flex items-center gap-4 text-sm">
        <span class="text-gray-500">Panel</span>
        <i class="bi bi-chevron-right text-gray-700 text-xs"></i>
        <span class="text-white font-medium">Dashboard</span>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-3 ml-auto">
        <!-- Search Button (Mobile) -->
        <button class="w-10 h-10 flex items-center justify-center rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all md:hidden">
            <i class="bi bi-search text-lg"></i>
        </button>

        <!-- Notifications -->
        <button class="relative w-10 h-10 flex items-center justify-center rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all group">
            <i class="bi bi-bell text-lg group-hover:scale-110 transition-transform"></i>
            <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-blue-500 rounded-full border-2 border-[#09090b]"></span>
        </button>

        <!-- Settings -->
        <button class="w-10 h-10 flex items-center justify-center rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all group">
            <i class="bi bi-gear text-lg group-hover:rotate-45 transition-transform"></i>
        </button>

        <!-- Divider -->
        <div class="w-px h-6 bg-white/10 mx-2"></div>

        <!-- User Profile -->
        <div class="flex items-center gap-3 pl-2 cursor-pointer group">
            <div class="text-right hidden md:block">
                <p class="text-xs font-semibold text-white">Andrés García</p>
                <p class="text-[10px] text-gray-500 uppercase tracking-wider">Desarrollador</p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-blue-400 p-px shadow-lg shadow-blue-500/10 group-hover:scale-105 transition-transform">
                <div class="w-full h-full rounded-[10px] bg-[#09090b] flex items-center justify-center">
                    <img src="https://ui-avatars.com/api/?name=Andres+Garcia&background=0D8ABC&color=fff" class="w-full h-full rounded-[10px] opacity-90" alt="Profile">
                </div>
            </div>
        </div>
    </div>
</div>
