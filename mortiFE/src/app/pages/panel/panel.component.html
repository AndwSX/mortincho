<div class="flex h-screen bg-[#09090b] text-[#fafafa] overflow-hidden font-['Outfit']">
    <!-- Sidebar Container -->
    <aside class="group/sidebar w-20 hover:w-72 hidden md:block flex-shrink-0 border-r border-white/5 bg-[#09090b] transition-all duration-300 ease-in-out z-30 relative">
        <app-sidebar></app-sidebar>
    </aside>

    <!-- Main View -->
    <div class="flex flex-col flex-1 min-w-0 overflow-hidden relative">
        <!-- Background Gradient -->
        <div class="absolute top-0 right-0 w-full h-full bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/10 via-transparent to-transparent pointer-events-none"></div>

        <!-- Navbar -->
        <header class="h-20 flex-shrink-0 z-20 glass-nav border-b border-white/5">
            <app-navbar></app-navbar>
        </header>

        <!-- Content Scroll Area -->
        <main 
            [ngClass]="isDrawerOpen ? 'z-[100]' : 'z-10'"
            class="flex-1 overflow-y-auto p-6 md:p-10 relative custom-scrollbar transition-all duration-300">
            <!-- Fade-in container for router outlet -->
            <div class="max-w-7xl mx-auto animate-fadeIn">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>

    <!-- Global Slide-over Drawer (The Shell) -->
    <app-shared-drawer 
        [isOpen]="isDrawerOpen" 
        [title]="drawerTitle" 
        [subtitle]="drawerSubtitle"
        (close)="closeDrawer()">
        
        <!-- Module-specific content -->
        <app-producto-drawer 
            *ngIf="drawerType === 'producto'"
            [mode]="drawerMode"
            [form]="drawerData"
            (saved)="handleSaved()"
            (cancelled)="closeDrawer()">
        </app-producto-drawer>

        <app-movimiento-drawer
            *ngIf="drawerType === 'movimiento'"
            (saved)="handleSaved()"
            (cancelled)="closeDrawer()">
        </app-movimiento-drawer>

        <app-venta-drawer
            *ngIf="drawerType === 'venta'"
            [mode]="drawerMode"
            [form]="drawerData"
            (saved)="handleSaved()"
            (cancelled)="closeDrawer()">
        </app-venta-drawer>

        <app-pago-drawer
            *ngIf="drawerType === 'pago'"
            [form]="drawerData"
            (saved)="handleSaved()"
            (cancelled)="closeDrawer()">
        </app-pago-drawer>

        <!-- (Future drawers for other modules will go here) -->

    </app-shared-drawer>
</div>
