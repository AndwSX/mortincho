<div class="min-h-screen flex items-center justify-center p-6 bg-[#09090b] relative overflow-hidden">
    <!-- Decorative background elements -->
    <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-600/20 rounded-full blur-[120px] animate-pulse"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-900/20 rounded-full blur-[120px] animate-pulse" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-md z-10">
        <!-- Logo/Header -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-blue-400 shadow-lg shadow-blue-500/20 mb-4">
                <i class="bi bi-person-plus text-3xl text-white"></i>
            </div>
            <h1 class="text-4xl font-bold tracking-tight text-white mb-2">Crea tu Cuenta</h1>
            <p class="text-gray-400 font-light">Únete a Mortincho y optimiza tu negocio</p>
        </div>

        <!-- Register Card -->
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <form (submit)="$event.preventDefault()" class="space-y-6">
                <!-- User Field -->
                <div class="space-y-2">
                    <label for="user" class="text-sm font-medium text-gray-300 ml-1">Usuario</label>
                    <div class="relative group">
                        <i class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors"></i>
                        <input 
                            type="text" 
                            id="user" 
                            name="usuario" 
                            [(ngModel)]="userData.usuario" 
                            class="input-field w-full pl-12" 
                            placeholder="Ej: juan_perez" 
                            required>
                    </div>
                </div>

                <!-- Email Field -->
                <div class="space-y-2">
                    <label for="email" class="text-sm font-medium text-gray-300 ml-1">Correo Electrónico</label>
                    <div class="relative group">
                        <i class="bi bi-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors"></i>
                        <input 
                            type="email" 
                            id="email" 
                            name="correo" 
                            [(ngModel)]="userData.correo" 
                            class="input-field w-full pl-12" 
                            placeholder="nombre&#64;ejemplo.com" 
                            required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-2">
                    <label for="password" class="text-sm font-medium text-gray-300 ml-1">Contraseña</label>
                    <div class="relative group">
                        <i class="bi bi-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            [(ngModel)]="userData.password" 
                            class="input-field w-full pl-12" 
                            placeholder="Mínimo 8 caracteres" 
                            required>
                    </div>
                </div>


                <!-- Submit Button -->
                <button 
                    type="submit" 
                    (click)="onRegistro()"
                    [disabled]="isLoading"
                    class="btn-primary w-full py-3 rounded-2xl flex items-center justify-center gap-2 group">
                    <span *ngIf="isLoading" class="spinner"></span>
                    <i *ngIf="!isLoading" class="bi bi-check2-circle text-xl group-hover:scale-110 transition-transform"></i>
                    <span class="text-lg font-semibold">{{ isLoading ? 'Creando...' : 'Registrarme ahora' }}</span>
                </button>
            </form>

            <!-- Footer Links -->
            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <p class="text-gray-400 text-sm">
                    ¿Ya tienes una cuenta? 
                    <a href="/auth/login" class="text-blue-500 font-semibold hover:text-blue-400 transition-colors ml-1">Inicia sesión aquí</a>
                </p>
            </div>
        </div>
    </div>
</div>
